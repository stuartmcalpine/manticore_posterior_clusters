# Quality selection cuts for posterior association catalog
#
# Each selection defines criteria as:
#   parameter: [min, max]
# where null means no limit on that end.
#
# Available parameters:
#   - ambiguity_rate: fraction of members with ambiguous assignments
#   - n_members: number of member halos in the association
#   - sigma_R: positional standard deviation in Mpc
#   - sigma_log_M: mass standard deviation in log10(M/Msol)

Raw: {}  # No cuts - all clusters

Fiducial:
  ambiguity_rate: [null, 0.05]  # <= 5%
  n_members: [20, null]         # >= 20 members

Strict:
  ambiguity_rate: [null, 0.05]  # <= 5%
  n_members: [20, null]         # >= 20 members
  sigma_R: [null, 2.5]          # <= 2.5 Mpc
  sigma_log_M: [null, 0.25]     # <= 0.25 dex
